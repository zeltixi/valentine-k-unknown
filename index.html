<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Международным женским днем! 🎀</title>

<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff4e8a, #ff9a9e);
        overflow: hidden;
        color: white;
        text-align: center;
    }

    .container {
        max-width: 800px;
        padding: 20px;
        opacity: 1;
        transition: opacity 1.5s ease;
    }

    .fade-out {
        opacity: 0;
    }

    h1 {
        font-size: 2.3em;
        animation: fadeIn 1.5s ease-in-out;
    }

    p.small {
        font-size: 0.9em;
        opacity: 0.8;
        margin-top: 30px;
    }

    button {
        margin: 15px;
        padding: 15px 35px;
        font-size: 1.1em;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        background-color: white;
        color: #ff4e8a;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.08);
        background-color: #ffe6f0;
    }

    .hidden {
        display: none;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(-20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .heart {
        position: absolute;
        color: rgba(255,255,255,0.5);
        font-size: 20px;
        animation: float 6s linear infinite;
    }

    @keyframes float {
        from {
            transform: translateY(100vh);
            opacity: 1;
        }
        to {
            transform: translateY(-10vh);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="container" id="page1">
    <h1>С международным женским днём! ❤️</h1>
    <button onclick="nextPage()">Продолжить</button>

<div class="container hidden" id="page2">
    <h1>Мама, спасибо тебе за все, еще раз тебя поздравляю и желаю всего наилучшего!</h1>
    <div>
        <button onclick="showFinal()">Дальше</button>
    </div>
</div>

<div class="container hidden" id="page3">
    <h1>Надеюсь удалось поднять настроение и вызвать теплую улыбку 💖</h1>
</div>


<script>
    function nextPage() {
        document.getElementById('page1').classList.add('hidden');
        document.getElementById('page2').classList.remove('hidden');
    }

    function showFinal() {
        document.getElementById('page2').classList.add('hidden');
        document.getElementById('page3').classList.remove('hidden');

        setTimeout(startFadeOut, 10000);
    }

    function startFadeOut() {
        const page3 = document.getElementById('page3');
        page3.classList.add('fade-out');

        setTimeout(showMystery, 1500);
    }

    function showMystery() {
        document.getElementById('page3').classList.add('hidden');
        document.getElementById('page3').classList.remove('hidden');

        // Закрытие через 30 секунд
        setTimeout(closePage, 30000);
    }

    function closePage() {
        window.close();

        // Если браузер не разрешил закрытие
        setTimeout(() => {
            document.body.innerHTML = "<h1 style='color:white;text-align:center;'> 💌</h1>";
        }, 500);
    }

    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 10) + "px";
        heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }

    setInterval(createHeart, 400);
</script>

</body>

</html>
